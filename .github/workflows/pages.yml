# Tests, builds and publishes the page to GitHub Pages on every push to main.
#
# Optional repository variables (Settings → Secrets and variables → Actions → Variables):
#   VITE_TRAKT_CLIENT_ID     the page's built-in Trakt app (visitors then needn't set up their own)
#   VITE_TRAKT_REDIRECT_URI  this page's address, e.g. https://you.github.io/streaming-sync/, to
#                            offer "Sign in with Trakt" (also add it to the Trakt app's Redirect uris)
# Both are public by design: they end up in the page's JavaScript. Never put a secret here.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_TRAKT_CLIENT_ID: ${{ vars.VITE_TRAKT_CLIENT_ID }}
          VITE_TRAKT_REDIRECT_URI: ${{ vars.VITE_TRAKT_REDIRECT_URI }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
